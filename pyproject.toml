[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ara-agent"
version = "0.1.0"
description = "ARA - Autonomous Multimodal Research and Decision Agent (production-grade agentic runtime with ColPali-family visual RAG, MCP tools, policy engine and verification)"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "jsonschema>=4.21",
    "pypdf>=4.0",
    "PyYAML>=6.0",
    "pillow>=10.2",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]
prod = [
    "psycopg[binary]>=3.1",
    "redis>=5.0",
    "qdrant-client>=1.9",
    "pypdfium2>=4.30",
]
otel = [
    "opentelemetry-sdk>=1.24",
    "opentelemetry-api>=1.24",
]

[tool.setuptools.packages.find]
include = ["ara*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"
