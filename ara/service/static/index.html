<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARA — Autonomous Research Agent</title>
<style>
  :root { --bg:#0e1117; --panel:#161b22; --border:#2d333b; --text:#e6edf3; --muted:#8b949e;
          --accent:#539bf5; --ok:#57ab5a; --warn:#c69026; --err:#e5534b; --user:#1f6feb33; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--text); font:14px/1.5 -apple-system,"Segoe UI",Roboto,sans-serif; height:100vh; display:flex; }
  aside { width:340px; min-width:280px; border-right:1px solid var(--border); background:var(--panel);
          display:flex; flex-direction:column; overflow:hidden; }
  main { flex:1; display:flex; flex-direction:column; overflow:hidden; }
  header { padding:12px 16px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:10px; }
  header h1 { font-size:15px; font-weight:600; }
  .badge { font-size:11px; padding:2px 8px; border-radius:10px; background:var(--border); color:var(--muted); }
  .badge.ok { background:#2ea04333; color:var(--ok); }
  .badge.warn { background:#c6902633; color:var(--warn); }
  .scroll { flex:1; overflow-y:auto; padding:12px; }
  section { margin-bottom:18px; }
  section h2 { font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin-bottom:8px; }
  button { background:var(--border); color:var(--text); border:1px solid transparent; border-radius:6px;
           padding:6px 12px; cursor:pointer; font-size:13px; }
  button:hover { filter:brightness(1.2); }
  button.primary { background:var(--accent); color:#fff; }
  button.approve { background:#2ea043; color:#fff; }
  button.reject { background:var(--err); color:#fff; }
  input,textarea { background:var(--bg); border:1px solid var(--border); color:var(--text);
                   border-radius:6px; padding:8px; font:inherit; width:100%; }
  textarea { resize:vertical; min-height:64px; }
  .card { background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:10px; margin-bottom:8px; }
  .msg { max-width:78%; padding:10px 14px; border-radius:12px; margin-bottom:10px; white-space:pre-wrap; }
  .msg.user { background:var(--user); margin-left:auto; }
  .msg.assistant { background:var(--panel); border:1px solid var(--border); }
  .msg .meta { margin-top:8px; font-size:12px; color:var(--muted); }
  .cite { color:var(--accent); cursor:pointer; text-decoration:underline dotted; }
  #composer { border-top:1px solid var(--border); padding:12px; display:flex; gap:8px; align-items:flex-end; }
  #composer textarea { flex:1; }
  .verdict { padding:8px 10px; border-radius:8px; font-size:12px; margin-top:8px; border:1px solid var(--border); }
  .verdict.ok { border-color:#2ea04366; } .verdict.refused { border-color:var(--err); color:var(--err); }
  .verdict.conflict { border-color:var(--warn); color:var(--warn); }
  .approval { border:1px solid var(--warn); }
  .approval .risk { color:var(--warn); font-weight:600; }
  table { width:100%; border-collapse:collapse; font-size:12px; }
  td,th { text-align:left; padding:4px 6px; border-bottom:1px solid var(--border); }
  .kv { color:var(--muted); font-size:12px; }
  .spinner { display:inline-block; width:14px; height:14px; border:2px solid var(--muted);
             border-top-color:var(--accent); border-radius:50%; animation:spin 1s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>
<body>
<aside>
  <header><h1>ARA</h1><span id="health" class="badge">connecting…</span></header>
  <div class="scroll">
    <section>
      <h2>Documents</h2>
      <input type="file" id="docFile">
      <button id="uploadBtn" style="margin-top:6px;width:100%">Upload &amp; ingest</button>
      <div id="docList" style="margin-top:8px"></div>
    </section>
    <section>
      <h2>Approval requests</h2>
      <div id="approvals"><div class="kv">none pending</div></div>
    </section>
    <section>
      <h2>Tasks</h2>
      <div id="taskList"><div class="kv">none yet</div></div>
    </section>
    <section>
      <h2>Execution trace <span class="kv">(admin)</span></h2>
      <div id="trace"><div class="kv">select a task</div></div>
    </section>
  </div>
</aside>
<main>
  <header><h1>Research chat</h1><span id="answerState" class="badge"></span></header>
  <div class="scroll" id="chat"></div>
  <div id="composer">
    <textarea id="input" placeholder="Ask about your documents, request calculations, or launch a multi-step task… (Ctrl+Enter to send)"></textarea>
    <button class="primary" id="sendBtn">Send</button>
  </div>
</main>
<script>
const API = "";
const KEY = localStorage.getItem("ara_key") || prompt("API key (dev default: ara-dev-key-change-me):") || "";
localStorage.setItem("ara_key", KEY);
const H = { "Content-Type": "application/json", "X-API-Key": KEY };
let currentTaskId = null;

const $ = id => document.getElementById(id);
function esc(s){ const d=document.createElement("div"); d.textContent = s ?? ""; return d.innerHTML; }

async function api(path, opts={}) {
  const r = await fetch(API + path, { headers: H, ...opts });
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.message || r.statusText);
  return body;
}

async function checkHealth() {
  try { const h = await api("/health");
    $("health").textContent = `llm:${h.llm_provider} · colpali:${h.colpali_mode}`;
    $("health").className = "badge ok";
  } catch { $("health").textContent = "offline"; $("health").className = "badge warn"; }
}

function addMsg(role, text, extra="") {
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.innerHTML = esc(text).replace(/\[(ev_[a-z0-9_]+)\]/g, '<span class="cite">[$1]</span>') + extra;
  $("chat").appendChild(div);
  $("chat").scrollTop = $("chat").scrollHeight;
  return div;
}

async function send() {
  const text = $("input").value.trim();
  if (!text) return;
  $("input").value = "";
  addMsg("user", text);
  const busy = addMsg("assistant", "", "");
  busy.innerHTML = '<span class="spinner"></span> planning & retrieving…';
  try {
    const body = await api("/chat", { method:"POST", body: JSON.stringify({ message: text }) });
    if (body.status === "WAITING_FOR_APPROVAL") {
      busy.className = "msg assistant approval";
      const a = body.proposed_action || {};
      busy.innerHTML = `⏸ <b>Approval required</b> — tool <code>${esc(a.tool||"?")}</code>
        <span class="risk">[${esc(a.risk||"")} risk]</span><br>
        <span class="kv">${esc(a.reason||"")}</span><br>
        <button class="approve" onclick="decide('${body.task_id}','${a.approval_id}','APPROVED')">Approve</button>
        <button class="reject" onclick="decide('${body.task_id}','${a.approval_id}','REJECTED')">Reject</button>`;
      refreshTasks();
    } else {
      const v = body.verification || {};
      const cls = v.refused ? "refused" : (v.conflicts?.length ? "conflict" : "ok");
      let verdict = v.refused
        ? `🛡 Refused: ${esc(v.refusal_reason||"evidence insufficient")}`
        : `✅ ${v.claims?.filter(c=>c.supported).length||0} verified claim(s), ${(body.citations||[]).length} citation(s)`;
      if (v.conflicts?.length) verdict += ` · ⚠ ${v.conflicts.length} source conflict(s)`;
      busy.innerHTML = esc(body.answer||"")
        .replace(/\[(ev_[a-z0-9_]+)\]/g, '<span class="cite">[$1]</span>')
        + `<div class="verdict ${cls}">${verdict}</div>`
        + `<div class="meta">task <a href="#" onclick="showTrace('${body.task_id}');return false;">${esc(body.task_id)}</a></div>`;
      currentTaskId = body.task_id;
    }
  } catch (e) { busy.innerHTML = `⚠ ${esc(e.message)}`; }
  refreshTasks(); refreshApprovals();
}

async function decide(taskId, approvalId, decision) {
  try {
    const body = await api(`/tasks/${taskId}/approve`, { method:"POST", body: JSON.stringify({ decision }) });
    addMsg("assistant", decision === "APPROVED"
      ? `Approved. Result: ${body.answer || body.status}`
      : "Rejected. The action was not executed.");
  } catch (e) { addMsg("assistant", `⚠ ${e.message}`); }
  refreshTasks(); refreshApprovals();
}

async function refreshTasks() {
  try {
    const { tasks } = await api("/tasks");
    $("taskList").innerHTML = tasks.length ? tasks.slice(0,12).map(t =>
      `<div class="card"><b>${esc(t.status)}</b> <span class="kv">${esc(t.id.slice(0,14))}…</span>
       <div class="kv">${esc(t.created_at?.slice(0,19))}</div>
       <a href="#" onclick="showTrace('${t.id}');return false;">trace</a></div>`).join("")
      : '<div class="kv">none yet</div>';
  } catch {}
}

async function refreshApprovals() {
  try {
    const { tasks } = await api("/tasks");
    const pending = tasks.filter(t => t.status === "WAITING_FOR_APPROVAL");
    if (!pending.length) { $("approvals").innerHTML = '<div class="kv">none pending</div>'; return; }
    let html = "";
    for (const t of pending) {
      const d = await api(`/tasks/${t.id}`);
      html += `<div class="card approval"><b>${esc(d.goal?.slice(0,40)||t.id.slice(0,12))}</b>
        <div class="kv">waiting for your decision</div></div>`;
    }
    $("approvals").innerHTML = html;
  } catch {}
}

async function showTrace(taskId) {
  currentTaskId = taskId;
  try {
    const tr = await api(`/tasks/${taskId}/trace`);
    const rows = (tr.spans||[]).map(s => `<tr><td>${esc(s.name)}</td><td>${esc(s.status)}</td>
      <td class="kv">${esc((s.attributes&&JSON.stringify(s.attributes).slice(0,60))||"")}</td></tr>`).join("");
    $("trace").innerHTML = `<div class="kv">trace ${esc(tr.trace_id||"")}</div>
      <table><tr><th>span</th><th>status</th><th>detail</th></tr>${rows||"<tr><td colspan=3>no spans (task still queued)</td></tr>"}</table>`;
  } catch (e) { $("trace").innerHTML = `<div class="kv">${esc(e.message)}</div>`; }
}

async function refreshDocs() {
  try {
    const { documents } = await api("/documents");
    $("docList").innerHTML = documents.length ? documents.map(d =>
      `<div class="card"><b>${esc(d.title)}</b> <span class="kv">${d.pages}p · ${esc(d.doc_type||"")}</span></div>`).join("")
      : '<div class="kv">no documents yet</div>';
  } catch {}
}

$("sendBtn").onclick = send;
$("input").addEventListener("keydown", e => { if (e.key === "Enter" && (e.ctrlKey||e.metaKey)) send(); });
$("uploadBtn").onclick = async () => {
  const f = $("docFile").files[0];
  if (!f) return alert("choose a file first");
  const fd = new FormData(); fd.append("file", f);
  try {
    const r = await fetch("/documents", { method:"POST", headers:{ "X-API-Key": KEY }, body: fd });
    const b = await r.json();
    addMsg("assistant", `📄 Ingested <b>${esc(f.name)}</b>: ${b.pages} page(s), id ${esc(b.document_id||"")}`);
    refreshDocs();
  } catch (e) { addMsg("assistant", `⚠ upload failed: ${esc(e.message)}`); }
};

checkHealth(); refreshDocs(); refreshTasks(); refreshApprovals();
setInterval(() => { refreshApprovals(); }, 5000);
</script>
</body>
</html>
